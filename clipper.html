<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NeonClipping MVP — Audio-First 9:16 Engine</title>
  <style>
    :root {
      --bg: #0b0e17;
      --panel: #131826;
      --border: #232b40;
      --text: #eef2ff;
      --muted: #94a3b8;
      --neon: #39ff14;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #171d32 0%, var(--bg) 60%);
      color: var(--text); min-height: 100vh; padding: 24px 16px 48px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
    .pill { font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.35); color: var(--cyan); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 12px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #0d111c; color: var(--text); font-size: 0.95rem;
    }
    .btn {
      background: linear-gradient(135deg, var(--neon), var(--cyan)); color: #061014;
      font-weight: 700; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; font-size: 0.96rem;
    }
    .btn:disabled { opacity: 0.5; cursor: progress; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .clip-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .clip-card video { width: 100%; aspect-ratio: 9 / 16; background: #000; max-height: 440px; }
    .clip-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .hook { font-size: 0.84rem; color: var(--cyan); }
    .meta { font-size: 0.78rem; color: var(--muted); }
    .stars { display: flex; gap: 6px; margin-top: 4px; }
    .star-btn {
      background: #1a2134; color: #facc15; border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 0.85rem;
    }
    .links { display: flex; gap: 10px; font-size: 0.85rem; }
    .links a { color: var(--neon); text-decoration: none; }
    #status { font-size: 0.88rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>NeonClipping MVP · NAUM Studio</h1>
        <div class="meta">Clean-room audio-first движок 9:16 · 0₴ локально · YouTube/MP4 → шортсы с субтитрами</div>
      </div>
      <span id="health-pill" class="pill">Проверка движка...</span>
    </header>

    <section class="card">
      <label for="source">Ссылка (YouTube / Twitch / Kick) или путь к локальному MP4</label>
      <input id="source" type="text" placeholder="https://www.youtube.com/watch?v=... или /path/to/video.mp4">
      <div class="grid-form">
        <div>
          <label for="mode">Режим</label>
          <select id="mode">
            <option value="fast">Fast (Audio-First)</option>
            <option value="full">Full (локальный файл / полный разбор)</option>
          </select>
        </div>
        <div>
          <label for="style">Стиль субтитров</label>
          <select id="style">
            <option value="neon">Neon</option>
            <option value="impact">Impact</option>
            <option value="clean">Clean</option>
            <option value="hormozi">Hormozi</option>
            <option value="bold_box">Bold Box</option>
          </select>
        </div>
        <div>
          <label for="framing">Компоновка 9:16</label>
          <select id="framing">
            <option value="blur_pad">Blur Pad</option>
            <option value="center_crop">Center Crop</option>
            <option value="split_cam">Split Cam</option>
          </select>
        </div>
        <div>
          <label for="max-clips">Клипов</label>
          <input id="max-clips" type="number" min="1" max="5" value="2">
        </div>
      </div>
      <div class="row">
        <button id="run-btn" class="btn" type="button">Нарезать 9:16 клипы</button>
        <label style="display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;">
          <input id="heading" type="checkbox" checked style="width:auto;"> Заголовок-крючок сверху
        </label>
        <label style="display:flex;align-items:center;gap:6px;margin:0;cursor:pointer;">
          <input id="use-llm" type="checkbox" style="width:auto;"> Локальный Ollama-судья
        </label>
      </div>
      <div id="status">Готов к работе.</div>
    </section>

    <section>
      <div id="clips" class="clips"></div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const clipsEl = document.getElementById('clips');
    const healthEl = document.getElementById('health-pill');
    const runBtn = document.getElementById('run-btn');

    async function refreshHealthAndClips() {
      try {
        const [hRes, cRes] = await Promise.all([fetch('/api/health'), fetch('/api/clips')]);
        const h = await hRes.json();
        const c = await cRes.json();
        healthEl.textContent = `ffmpeg: ${h.ffmpeg ? 'OK' : 'NO'} · yt-dlp: ${h.yt_dlp ? 'OK' : 'NO'} · Ollama: ${h.ollama ? 'ON' : 'OFF'}`;
        renderClips(c.clips || []);
      } catch (e) {
        healthEl.textContent = 'Ошибка подключения';
      }
    }

    function renderClips(list) {
      clipsEl.innerHTML = '';
      for (const clip of list) {
        const card = document.createElement('article');
        card.className = 'clip-card';
        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'metadata';
        video.src = '/clips/' + encodeURIComponent(clip.mp4_name);
        card.appendChild(video);

        const body = document.createElement('div');
        body.className = 'clip-body';
        const title = document.createElement('strong');
        title.textContent = clip.title || clip.mp4_name;
        const hook = document.createElement('div');
        hook.className = 'hook';
        hook.textContent = clip.hook ? `Hook: ${clip.hook}` : '';
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${clip.start_sec}s–${clip.end_sec}s · score ${clip.score} · ${clip.caption_style}/${clip.framing}`;

        const links = document.createElement('div');
        links.className = 'links';
        for (const [label, fname] of [['MP4', clip.mp4_name], ['SRT', clip.srt_name], ['VTT', clip.vtt_name]]) {
          if (!fname) continue;
          const a = document.createElement('a');
          a.href = '/clips/' + encodeURIComponent(fname);
          a.download = fname;
          a.textContent = label;
          links.appendChild(a);
        }

        const stars = document.createElement('div');
        stars.className = 'stars';
        for (let r = 1; r <= 5; r++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'star-btn';
          btn.textContent = `${r}★`;
          btn.onclick = async () => {
            await fetch('/api/feedback', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({clip_id: clip.clip_id, rating: r, features: clip.features || {}})
            });
            statusEl.textContent = `Оценка ${r}★ сохранена в локальный feedback.jsonl`;
          };
          stars.appendChild(btn);
        }

        body.append(title, hook, meta, links, stars);
        card.appendChild(body);
        clipsEl.appendChild(card);
      }
    }

    runBtn.onclick = async () => {
      const source = document.getElementById('source').value.trim();
      if (!source) {
        statusEl.textContent = 'Укажите ссылку или путь к видеофайлу.';
        return;
      }
      runBtn.disabled = true;
      statusEl.textContent = 'Анализ аудио и нарезка 9:16...';
      try {
        const res = await fetch('/api/clip', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            source,
            mode: document.getElementById('mode').value,
            style: document.getElementById('style').value,
            framing: document.getElementById('framing').value,
            max_clips: Number(document.getElementById('max-clips').value || 2),
            opening_heading: document.getElementById('heading').checked,
            use_llm: document.getElementById('use-llm').checked
          })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          statusEl.textContent = 'Ошибка: ' + (data.error || res.statusText);
        } else {
          statusEl.textContent = `Готово: ${data.clips.length} клип(а) · движок субтитров: ${data.stt_engine}`;
          await refreshHealthAndClips();
        }
      } catch (e) {
        statusEl.textContent = 'Сбой запроса: ' + e;
      } finally {
        runBtn.disabled = false;
      }
    };

    refreshHealthAndClips();
  </script>
</body>
</html>
